<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>QR Clash - Player</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; background: #111; color: #fff; text-align: center; }
    #video { width: 100%; max-height: 45vh; object-fit: cover; background: #222; }
    .hud { padding: 12px; }
    .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; margin-bottom: 8px; }
    .active { background: #22c55e; color: #000; }
    .blocked { background: #eab308; color: #000; }
    .off { background: #ef4444; color: #fff; }
    select, button { padding: 10px 14px; font-size: 16px; margin: 4px; border-radius: 8px; border: none; }
  </style>
</head>
<body>
  <div class="hud">
    <h2>Player Controller</h2>
    <select id="slotSelect">
      <option value="p1">Join as Player 1</option>
      <option value="p2">Join as Player 2</option>
    </select>
    <button id="startCamBtn">Enable Camera</button>
    <div style="margin-top: 10px;">
      <span id="badge" class="status-badge off">Target Missing</span>
    </div>
    <h3 id="scoreText">Score: 0 / 1000</h3>
    <p id="msgText" style="color: #aaa;">Game idle</p>
  </div>

  <video id="video" playsinline></video>
  <canvas id="canvas" hidden></canvas>

  <script>
    const socket = io();
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const badge = document.getElementById('badge');
    const scoreText = document.getElementById('scoreText');
    const msgText = document.getElementById('msgText');

    let currentSlot = 'p1';
    let isDetecting = false;
    let cameraActive = false;

    document.getElementById('slotSelect').addEventListener('change', (e) => {
      currentSlot = e.target.value;
      socket.emit('joinGame', currentSlot);
    });

    document.getElementById('startCamBtn').addEventListener('click', async () => {
      socket.emit('joinGame', currentSlot);
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        video.srcObject = stream;
        await video.play();
        cameraActive = true;
        document.getElementById('startCamBtn').style.display = 'none';
        scanLoop();
      } catch (err) {
        alert('Camera permission denied or unsupported device');
      }
    });

    // Efficient scanning loop (checks every 80ms)
    function scanLoop() {
      if (!cameraActive) return;

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.height = video.videoHeight;
        canvas.width = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);

        if (code && code.data) {
          isDetecting = true;
          socket.emit('scanPing', { slot: currentSlot, detected: true, codeData: code.data });
        } else {
          isDetecting = false;
          socket.emit('scanPing', { slot: currentSlot, detected: false, codeData: null });
        }
      }
      setTimeout(scanLoop, 80);
    }

    socket.on('stateUpdate', (state) => {
      const myData = state.players[currentSlot];
      const otherSlot = currentSlot === 'p1' ? 'p2' : 'p1';
      const otherData = state.players[otherSlot];

      scoreText.innerText = `Score: ${myData.score} / 1000`;

      if (state.status === 'ENDED') {
        badge.className = 'status-badge off';
        badge.innerText = 'Game Finished';
        msgText.innerText = state.winner === myData.name ? '🎉 You Won!' : 'Defeat!';
      } else if (state.status === 'PAUSED') {
        badge.className = 'status-badge off';
        badge.innerText = 'Game Paused';
      } else if (myData.isScanning && otherData.isScanning) {
        badge.className = 'status-badge blocked';
        badge.innerText = 'Both Scanning: Contested (0 pts)';
      } else if (myData.isScanning) {
        badge.className = 'status-badge active';
        badge.innerText = 'Scoring Active!';
      } else {
        badge.className = 'status-badge off';
        badge.innerText = 'Aim at QR Code';
      }
    });
  </script>
</body>
</html>
